services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bis-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:8443,http://localhost:5173
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/data:/app/data:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/api/status" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bis-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
